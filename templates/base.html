<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OuiOui — {% block title %}{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥖</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        // The speaker button always plays at normal speed; the menu configures only
        // the slow (turtle) button. Persisted so it survives HTMX swaps.
        const NORMAL_RATE = 1;
        const SPEECH_RATE_KEY = 'ouioui.slowRate';

        function speechRate() {
            return parseFloat(localStorage.getItem(SPEECH_RATE_KEY)) || 0.5;
        }

        function setSpeechRate(rate) {
            localStorage.setItem(SPEECH_RATE_KEY, rate);
        }

        // Voices load asynchronously; getVoices() is empty on first call in Chrome.
        let VOICES = [];
        function loadVoices() { VOICES = window.speechSynthesis.getVoices() || []; }
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function frenchVoice() {
            if (!VOICES.length) loadVoices();
            // Prefer a local voice: remote ones commonly ignore the rate setting,
            // which is why picking a speed appeared to do nothing.
            return VOICES.find(function (v) { return v.lang.indexOf('fr') === 0 && v.localService; })
                || VOICES.find(function (v) { return v.lang.indexOf('fr') === 0; })
                || null;
        }

        // The turtle button, at whatever speed the menu is set to.
        function speakSlow(word) {
            speak(word, speechRate());
        }

        // rate omitted -> normal speed, unaffected by the menu setting.
        function speak(word, rate) {
            const r = parseFloat(rate) || NORMAL_RATE;
            window.speechSynthesis.cancel();
            // Chrome applies the previous utterance's settings when speak() runs in
            // the same tick as cancel(), so hand it over on the next one.
            setTimeout(function () {
                const u = new SpeechSynthesisUtterance(word);
                const v = frenchVoice();
                if (v) u.voice = v;
                u.lang = v ? v.lang : 'fr-FR';
                u.rate = Math.min(Math.max(r, 0.1), 10);
                window.speechSynthesis.speak(u);
            }, 60);
        }

        function markActiveRate() {
            const active = String(speechRate());
            document.querySelectorAll('.rate-option').forEach(function (b) {
                const on = b.dataset.rate === active;
                b.classList.toggle('bg-indigo-600', on);
                b.classList.toggle('text-white', on);
                b.classList.toggle('border-indigo-600', on);
                b.classList.toggle('text-stone-600', !on);
            });
        }

        // Swap a word card between its definitions and its conjugation table.
        function toggleConjugation(uid) {
            const entry = document.getElementById('mode-entry-' + uid);
            const conj = document.getElementById('mode-conj-' + uid);
            const btn = document.getElementById('mode-btn-' + uid);
            const showConj = conj.classList.contains('hidden');
            conj.classList.toggle('hidden', !showConj);
            entry.classList.toggle('hidden', showConj);
            btn.textContent = showConj ? 'Definitions' : 'Conjugaison';
            btn.classList.toggle('bg-indigo-600', showConj);
            btn.classList.toggle('text-white', showConj);
            btn.classList.toggle('text-indigo-600', !showConj);
        }

        document.addEventListener('DOMContentLoaded', function () {
            markActiveRate();
            const menu = document.getElementById('settings-menu');
            if (!menu) return;
            menu.addEventListener('click', function (e) {
                const btn = e.target.closest('.rate-option');
                if (!btn) return;
                setSpeechRate(btn.dataset.rate);
                markActiveRate();
                speak('vitesse', parseFloat(btn.dataset.rate));   // preview the new speed
                menu.open = false;
            });
            document.addEventListener('click', function (e) {
                if (!menu.contains(e.target)) menu.open = false;
            });
        });
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        .fade-out { opacity: 0; transition: opacity 300ms ease; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-6 py-3 flex items-center gap-6">
            <a href="/" class="text-lg font-bold text-indigo-600">&#129366; OuiOui</a>
            <div class="flex gap-4 text-sm">
                <a href="/search" class="hover:text-indigo-600 transition-colors">Chercher</a>
                <a href="/vocab" class="hover:text-indigo-600 transition-colors">Vocabulaire</a>
                <a href="/expressions" class="hover:text-indigo-600 transition-colors">Expressions</a>
                <a href="/quiz" class="hover:text-indigo-600 transition-colors">Quiz</a>
            </div>
            <details id="settings-menu" class="relative ml-auto">
                <summary class="list-none cursor-pointer px-2 py-1 rounded text-stone-400 hover:text-indigo-600 hover:bg-stone-50 transition-colors select-none"
                         title="Reglages">&#8943;</summary>
                <div class="absolute right-0 mt-2 w-48 bg-white border border-stone-200 rounded-lg shadow-lg p-3 z-20">
                    <div class="text-xs font-semibold text-stone-400 uppercase tracking-wide mb-1">
                        &#128034; Vitesse lente
                    </div>
                    <p class="text-xs text-stone-400 mb-2 normal-case">&#128264; reste a vitesse normale</p>
                    <div class="grid grid-cols-3 gap-1" id="speech-rate-options">
                        {% for r in ["0.9", "0.75", "0.5", "0.35", "0.25"] %}
                        <button type="button" data-rate="{{ r }}"
                                class="rate-option px-2 py-1 rounded text-xs text-stone-600 border border-stone-200 hover:border-indigo-300 transition-colors">
                            {{ r }}&times;
                        </button>
                        {% endfor %}
                    </div>
                </div>
            </details>
        </div>
    </nav>
    <main class="max-w-2xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
